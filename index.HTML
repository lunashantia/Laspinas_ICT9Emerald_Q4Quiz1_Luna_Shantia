<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Mass Index Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>;

    <style>
        
        h1 {font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; color: aliceblue;}

        body {background-color: rgb(94, 123, 179);}

        .container {background-color: rgb(35, 67, 131);}

    </style>

</head>
<body>
    
    <div>
    <h1 style="text-align: center;">BMI Calculator</h1>

    <details ontoggle="message()">
        <summary style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: center; color: aliceblue;"><b>HOW TO:</b></summary>
        <i><p style="text-align: center; color: aliceblue;">Input your height and weight to know your body mass index.</p></i>
    </details>

    </div>

    <div class= "container mt-5 text-white text-center">

        <h2>What is my BMI?</h2>

        <br>

        <input type="number" class="form-control" placeholder="height in meters" id="height">

<br>

        <input type="number" class="form-control" placeholder="weight in kilograms" id="weight">

        <br>

        <button type="submit" class="btn btn-primary" onclick="calc()">Calculate</button>

        <h1 id="show">You are..</h1>

    </div>

    <script>
        
        function calc() {

            var m = document.getElementById("height").value;
            var kg = document.getElementById("weight").value;
            var bmi = kg / (m * m)


            if ( bmi <18.5){
                document.getElementById("show").innerHTML = "underweight";
            }
            else if (bmi >= 18.5 && bmi<=24.9)
                {document.getElementById("show").innerHTML = "Normal Weight";}


            else if (bmi >=25 && bmi <=29.9)
                {document.getElementById("show").innerHTML = "Overweight";}


            else if (bmi >=30)
                {document.getElementById("show").innerHTML = "Obese";}

            else 
                {document.getElementById("show").innerHTML = "Input Details";}}

        

    </script>

</body>
</html>
